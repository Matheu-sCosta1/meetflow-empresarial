name: meetflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetflow}
      POSTGRES_USER: ${POSTGRES_USER:-meetflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - meetflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meetflow} -d ${POSTGRES_DB:-meetflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meetflow}
      DATABASE_USERNAME: ${POSTGRES_USER:-meetflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-meetflow_dev}
      JWT_SECRET: ${JWT_SECRET:-meetflow-dev-secret-key-change-before-production-2026-very-long}
      MAIL_MODE: ${MAIL_MODE:-log}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_SES_FROM: ${AWS_SES_FROM:-no-reply@meetflow.local}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      MEDIA_PATH: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - meetflow_media:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 4s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  meetflow_postgres:
  meetflow_media:
