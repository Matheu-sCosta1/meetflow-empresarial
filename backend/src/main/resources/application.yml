spring:
  application:
    name: meetflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/meetflow}
    username: ${DATABASE_USERNAME:meetflow}
    password: ${DATABASE_PASSWORD:meetflow_dev}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      minimum-idle: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:4173}
  jwt:
    secret: ${JWT_SECRET:meetflow-dev-secret-key-change-before-production-2026-very-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  storage:
    path: ${MEDIA_PATH:./uploads}
    mode: ${STORAGE_MODE:filesystem}
    database-max-bytes: ${STORAGE_DATABASE_MAX_BYTES:12582912}
  mail:
    mode: ${MAIL_MODE:log}
    region: ${AWS_REGION:us-east-1}
    from: ${AWS_SES_FROM:no-reply@meetflow.local}
